# Créer le Playbook principal (site.yml)

# Le playbook / chef d'orchestre.

- hosts: web
  become: yes  #exécuter les tâches en tant qu'administrateur sur les machines distantes

  roles:
    - nginx

  #faire de meme pour chaque role
- hosts: db
  become: yes
  roles:
    - mariadb

- hosts: monitoring
  become: yes
  roles:
    - monitoring
